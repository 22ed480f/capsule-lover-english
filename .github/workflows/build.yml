name: Build release files

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
      - run: uv sync --locked --group build --python 3.12
      - run: uv run --group build python build_windows.py
      - run: uv run python package_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: capsule-lover-english
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content english.json -Raw | ConvertFrom-Json).release
          $tag = "v$version"
          @"
          English patch beta for Windows testing.

          Download **CapsuleLover-English.exe**, open it, and click **Install English**.
          Keep **Simplified Chinese** selected in the game.

          Prefer the script? Download **CapsuleLover-English-Python.zip**.
          "@ | Set-Content build/release-notes.md -Encoding utf8
          $assets = @(Get-ChildItem dist/release -File | ForEach-Object { $_.FullName })
          gh release create $tag @assets --target $env:GITHUB_SHA --title "English Patch $version" --prerelease --notes-file build/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
